{% extends "portal/base.html" %}
{% block title %}Register Worker{% endblock %}
{% block content %}
<h1>Worker registration</h1>
<p class="sub">Fill in the worker's details. A registration number is generated automatically on submission.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<div class="card" style="max-width:640px">
  <form method="post">{% csrf_token %}
    <label>Worker name *</label>
    <input type="text" name="worker_name" required maxlength="120" placeholder="Full name">
    <label>Father's name</label>
    <input type="text" name="father_name" maxlength="120">
    <div class="grid c2">
      <div><label>Gender</label>
        <select name="gender"><option>Male</option><option>Female</option><option>Others</option><option>Unknown</option></select></div>
      <div><label>Age</label>
        <input type="number" name="age" min="18" max="60" placeholder="18–60"></div>
    </div>
    <div class="grid c2">
      <div><label>Bank IFSC code</label>
        <input type="text" name="ifsc_code" maxlength="11" placeholder="e.g. SBIN0001234" style="text-transform:uppercase"></div>
      <div><label>District code</label>
        <input type="text" name="district_code" maxlength="10"></div>
    </div>
    <label>Trade code (nature of employment)</label>
    <input type="text" name="trade_code" maxlength="10" placeholder="e.g. 9">
    <label>Village (Telangana &rsaquo; District &rsaquo; Mandal &rsaquo; Village)</label>
    <select name="village">
      <option value="">— select village —</option>
      {% for v in villages %}
      <option value="{{ v.id }}">{{ v.mandal.district.name }} › {{ v.mandal.name }} › {{ v.name }}</option>
      {% endfor %}
    </select>
    <label>Current establishment / employer (optional)</label>
    <select name="establishment">
      <option value="">— none / self-employed —</option>
      {% for e in establishments %}<option value="{{ e.id }}">{{ e.name }} ({{ e.est_no }})</option>{% endfor %}
    </select>
    <div class="grid c2">
      <div><label>Nominee name (dependent)</label>
        <input type="text" name="nominee_name" placeholder="e.g. spouse or child"></div>
      <div><label>Nominee relationship</label>
        <input type="text" name="nominee_relationship" placeholder="Wife / Son / Daughter…"></div>
    </div>
    <div class="checkline"><input type="checkbox" name="migrant_worker" id="mw"><label for="mw" style="margin:0">Migrant worker</label></div>
    <div class="checkline"><input type="checkbox" name="trade_union_member" id="tu"><label for="tu" style="margin:0">Trade union member</label></div>
    <div style="margin-top:20px"><button class="btn" type="submit">Register worker</button></div>
  </form>
</div>
{% endblock %}
